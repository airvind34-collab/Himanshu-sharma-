*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',Arial,sans-serif}
body{background:#000;color:#fff;text-align:center;overflow-x:hidden;min-height:100vh}
/* HIGH GRAPHIC BACKGROUND */
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 15% 15%,#4a3200 0%,transparent 45%),radial-gradient(circle at 85% 85%,#2a1a00 0%,transparent 45%),linear-gradient(180deg,#000,#0a0800,#000)}
.orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.5;z-index:0;animation:floatOrb 6s ease-in-out infinite alternate}
.orb1{width:220px;height:220px;background:#d4af6a;top:5%;left:-50px}
.orb2{width:180px;height:180px;background:#ff00aa;bottom:10%;right:-40px;animation-delay:1s}
.orb3{width:120px;height:120px;background:#00d4ff;top:50%;left:85%;animation-delay:2s}
@keyframes floatOrb{to{transform:translateY(-30px) scale(1.1)}}
canvas{position:fixed;inset:0;z-index:1}
.box{position:relative;z-index:2;padding:30px 15px;max-width:640px;margin:auto}
.top{color:#ffe9a8;letter-spacing:3px;font-size:11px;border:1px solid #d4af6a;padding:9px 16px;border-radius:30px;display:inline-block;background:rgba(255,255,255,.08);backdrop-filter:blur(15px);box-shadow:0 0 25px rgba(212,175,106,.3)}
/* PHOTO - ULTRA HIGH GRAPHIC */
.photo-box{position:relative;width:240px;height:240px;margin:30px auto 0;perspective:1000px}
.photo-box::before{content:'';position:absolute;inset:-12px;border-radius:50%;background:conic-gradient(from 0deg,#d4af6a,#fff,#ff00aa,#00d4ff,#d4af6a);animation:spin 3s linear infinite;filter:blur(1px)}
